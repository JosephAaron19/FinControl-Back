services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fincontrol_backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 fincontrol_backend.asgi:application"
    networks:
      - fincontrol_network

volumes:
  postgres_data:
    driver: local

networks:
  fincontrol_network:
    driver: bridge
