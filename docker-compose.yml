services:
  db:
    image: postgres:17
    container_name: fincontrol_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fincontrol_db
      POSTGRES_USER: fincontrol_user
      POSTGRES_PASSWORD: fincontrol_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincontrol_user -d fincontrol_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fincontrol_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fincontrol_backend
    restart: unless-stopped
    ports:
      - "8088:8000"
    env_file:
      - .env
    environment:
      DB_NAME: fincontrol_db
      DB_USER: fincontrol_user
      DB_PASSWORD: fincontrol_password
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 fincontrol_backend.asgi:application"
    networks:
      - fincontrol_network

volumes:
  postgres_data:
    driver: local

networks:
  fincontrol_network:
    driver: bridge
